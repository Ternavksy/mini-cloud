openapi: 3.0.3
info:
  title: mini-cloud API
  version: 1.0.0
paths:
  /upload:
    post:
      responses:
        '200':
          description: Uploaded file id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadFileEnvelope'
  /files:
    get:
      responses:
        '200':
          description: File list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilesEnvelope'
  /files/{id}:
    delete:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
  /download/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /collections:
    get:
      responses:
        '200':
          description: Collection list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionsEnvelope'
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectionRequest'
      responses:
        '201':
          description: Created collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileCollectionEnvelope'
  /collections/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileCollectionEnvelope'
    delete:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
  /collections/{id}/files/{fileID}:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: fileID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileCollectionEnvelope'
    delete:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: fileID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileCollectionEnvelope'
components:
  schemas:
    APIError:
      type: object
      required: [message]
      properties:
        message:
          type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/APIError'
    UploadFileResponse:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    UploadFileEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/UploadFileResponse'
    FilesResponse:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            type: string
    FilesEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/FilesResponse'
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    MessageEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/MessageResponse'
    CreateCollectionRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        file_ids:
          type: array
          items:
            type: string
    FileCollectionResponse:
      type: object
      required: [id, name, file_ids, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        file_ids:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
    FileCollectionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/FileCollectionResponse'
    CollectionsResponse:
      type: object
      required: [collections]
      properties:
        collections:
          type: array
          items:
            $ref: '#/components/schemas/FileCollectionResponse'
    CollectionsEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CollectionsResponse'
